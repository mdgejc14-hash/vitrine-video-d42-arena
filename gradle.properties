# D42.30 : 1280m -> 2048m — le packaging de l'APK (:app:packageDebug,
# IncrementalSplitterRunnable) est sorti en OutOfMemoryError heap sur android-ci
# avec l'ajout de libphonenumber (tout le reste : ktlint/detekt/tests/compile
# était VERT). Les runners ubuntu ont 7 Go : marge confortable.
org.gradle.jvmargs=-Xmx2048m -XX:MaxMetaspaceSize=900m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.configuration-cache=false
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official
kotlin.daemon.jvmargs=-Xmx768m
org.gradle.parallel=false
kotlin.incremental=false
kotlin.compiler.execution.strategy=in-process

