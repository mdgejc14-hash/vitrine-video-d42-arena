name: Preview D1 migrations

on:
  push:
    branches:
      - phase-a-backend-review
    paths:
      - "wrangler.jsonc"
      - "wrangler.preview-migrations.jsonc"
      - "db/migrations/**"
      - ".github/workflows/preview-d1-migrations.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: preview-d1-migrations
  cancel-in-progress: false

jobs:
  migrate-preview-d1:
    # D42.23 : cadrage architectural — ce workflow exige des secrets Actions
    # qui n'existent que dans le dépôt PRIVÉ mdgejc14-hash/vitrine-video
    # (inventaire checkpoint D42_23/01). Dans le miroir public (sans secrets),
    # il échouerait systématiquement sans information : on le SAUTE
    # honnêtement ici ; il s'exécute normalement dans le dépôt privé.
    if: github.repository == 'mdgejc14-hash/vitrine-video'
    name: Apply schema to isolated Preview D1 only
    if: github.repository == 'mdgejc14-hash/vitrine-video'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_D1_PREVIEW_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: d7dac13da931423a19812f6d9116bd47
      PREVIEW_D1_ID: 5b9060b1-60c5-460c-b88f-702d3cf6e432

    steps:
      - name: Check out PR branch
        uses: actions/checkout@v4

      - name: Validate Cloudflare credentials are configured
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${CLOUDFLARE_API_TOKEN:-}" ]]; then
            echo "::error::Missing GitHub Actions secret CLOUDFLARE_D1_PREVIEW_API_TOKEN. Set a Cloudflare API token scoped to D1 Edit for this account; never paste it into code or chat."
            exit 1
          fi

      - name: Validate Preview and migration configs are isolated from production
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import assert from 'node:assert/strict';

          const app = JSON.parse(fs.readFileSync('wrangler.jsonc', 'utf8'));
          const migration = JSON.parse(fs.readFileSync('wrangler.preview-migrations.jsonc', 'utf8'));
          const production = app.d1_databases.find((db) => db.binding === 'DB');
          const preview = app.previews?.d1_databases?.find((db) => db.binding === 'DB');
          const migrationTarget = migration.d1_databases?.find((db) => db.binding === 'PREVIEW_DB');

          assert.ok(production, 'Production DB binding not found');
          assert.ok(preview, 'Preview DB binding not found');
          assert.ok(migrationTarget, 'Dedicated PREVIEW_DB migration binding not found');
          assert.equal(production.database_id, '0dacf519-c4bd-40f6-baf7-75d9cdde2af6');
          assert.equal(preview.database_name, 'vitrine-video-db-preview');
          assert.equal(preview.database_id, process.env.PREVIEW_D1_ID);
          assert.notEqual(preview.database_id, production.database_id, 'Preview and production D1 IDs must differ');
          assert.equal(migrationTarget.database_name, preview.database_name);
          assert.equal(migrationTarget.database_id, preview.database_id);
          assert.equal(migrationTarget.migrations_dir, 'db/migrations');
          console.log('PASS: Preview D1 ID is distinct from production and both Preview configs agree.');
          NODE

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund

      - name: Apply migrations to Preview D1 only
        run: npx wrangler d1 migrations apply PREVIEW_DB --remote --config wrangler.preview-migrations.jsonc

      - name: Verify Preview schema
        shell: bash
        run: |
          set -euo pipefail
          npx wrangler d1 execute "$PREVIEW_D1_ID" \
            --remote \
            --config wrangler.preview-migrations.jsonc \
            --json \
            --command="SELECT COUNT(*) AS table_count FROM sqlite_master WHERE type='table' AND name IN ('users','merchants','projects','templates','orders','files','quota_events','notifications','purge_audit_runs','purge_operations','purge_operation_events');"             > preview-schema-check.json
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const parsed = JSON.parse(fs.readFileSync('preview-schema-check.json', 'utf8'));
          const rows = Array.isArray(parsed)
            ? parsed.flatMap((item) => Array.isArray(item?.results) ? item.results : [])
            : Array.isArray(parsed?.results) ? parsed.results : [];
          const count = Number(rows[0]?.table_count);
          if (count !== 11) {
            throw new Error(`Preview schema incomplete: expected 11 application/ledger tables, found ${Number.isFinite(count) ? count : 'unknown'}`);
          }
          console.log(`PASS: ${count}/11 application and purge-ledger tables exist in Preview D1.`);
          NODE
