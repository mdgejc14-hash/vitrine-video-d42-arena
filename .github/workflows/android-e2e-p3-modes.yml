          sudo udevadm trigger --name-match=kvm
          ls -l /dev/kvm || echo "KVM ABSENT"

      - name: ffmpeg (preuves acoustiques + injection voix)
        run: timeout 240 bash -c 'sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg' >/dev/null 2>&1 || echo "ffmpeg indisponible — le mode ne pourra pas être prouvé"

      - name: 'P3 : mode VOIX SEULE × 4 langues'
        env:
          # D42.28-16 : BGM titulaire téléchargé via le compte de test A (REST)
          # pour injection en cache (musique/mix) — session démo = pas de
          # téléchargement produit.
          FIREBASE_WEB_API_KEY: ${{ secrets.FIREBASE_WEB_API_KEY }}
          FIREBASE_TEST_A_EMAIL: ${{ secrets.FIREBASE_TEST_A_EMAIL }}
          FIREBASE_TEST_A_PASSWORD: ${{ secrets.FIREBASE_TEST_A_PASSWORD }}
          API_BASE_URL: ${{ vars.API_BASE_URL_PROD }}
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: default
          arch: x86_64
          profile: pixel_5
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back emulated -camera-front none
          script: adb devices && bash tools/e2e/run_p3_matrix.sh voix app/build/outputs/apk/debug/app-debug.apk

      - name: Artefact p3-voix
