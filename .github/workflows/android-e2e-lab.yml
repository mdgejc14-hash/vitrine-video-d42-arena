name: android-e2e-lab

# Laboratoire Android distant D42.13 — exécute l'APK RÉEL sur un émulateur
# Android, sans aucun secret : l'APK est construit en debug (clé debug générée
# par le runner). Aucun keystore, aucun jeton, aucune donnée de production.
#
# Preuves produites : captures PNG, dumps uiautomator, logcat, résultats
# PASS/FAIL/BLOCKED par scénario, taille d'écran, variantes de police et de
# rotation, plus une exécution sur petit écran (profil Nexus S).

on:
  workflow_dispatch:
  push:
    branches: [d42.13-lab, main]

# Un seul laboratoire à la fois : un nouveau push annule la run précédente au
# lieu d'empiler des émulateurs inutiles (coût = temps de runner, pas d'argent).
concurrency:
  group: android-e2e-lab-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Assemblage de l'APK debug (sans secret)
        run: |
          set -o pipefail
          ./gradlew :app:assembleDebug --stacktrace 2>&1 | tail -60
          ls -la app/build/outputs/apk/debug/

      - name: Empreinte de l'APK testé
        run: |
          sha256sum app/build/outputs/apk/debug/app-debug.apk | tee apk_sha256.txt
          echo "commit=$(git rev-parse HEAD)" | tee -a apk_sha256.txt

      - name: Activation KVM (accélération matérielle de l'émulateur)
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -l /dev/kvm || echo "KVM ABSENT"

      # ---------------------------------------------------------------------
      # Configuration 1 — téléphone standard (Pixel 5, 1080x2340, 420 dpi)
      #   a) parcours nominal  b) police 130 %  c) rotation paysage
      # ---------------------------------------------------------------------
      - name: Parcours P0 — Pixel 5 (nominal + police + rotation)
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: default
          arch: x86_64
          profile: pixel_5
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -camera-front none
          script: |
            adb devices
            bash tools/e2e/run_p0.sh pixel5 base
            bash tools/e2e/run_p0.sh pixel5 font130
            bash tools/e2e/run_p0.sh pixel5 rot90

      - name: Capture des artefacts Pixel 5
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-pixel5
          path: |
            artifacts/**
            apk_sha256.txt
          retention-days: 14
          if-no-files-found: warn

      # ---------------------------------------------------------------------
      # Configuration 2 — petit écran (540x960 @ 240 dpi), simulé sur l'AVD
      # stable : c'est la configuration où le défaut P1 « bouton hors écran »
      # se manifestait. Le profil Nexus S a été abandonné : l'image API 30 ne
      # démarre pas sur ce profil (constaté au run 42175579512, étape bloquée).
      # ---------------------------------------------------------------------
      - name: Parcours P0 — petit écran 540x960 (simulé sur Pixel 5)
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: default
          arch: x86_64
          profile: pixel_5
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -camera-front none
          script: |
            adb devices
            bash tools/e2e/run_p0.sh petit_ecran small
            bash tools/e2e/run_p0.sh petit_ecran font130

      - name: Capture des artefacts petit écran
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-petit-ecran
          path: artifacts/**
          retention-days: 14
          if-no-files-found: warn

      - name: Bilan agrégé
        if: always()
        run: |
          echo "=== BILAN PAR VARIANTE ==="
          for f in artifacts/*/summary.txt; do
            [ -f "$f" ] || continue
            echo "--- $f"; cat "$f"
          done
          echo "=== ÉCHECS ==="
          grep -h "FAIL" artifacts/*/results.tsv 2>/dev/null || echo "aucun FAIL enregistré"
          echo "=== BLOQUÉS ==="
          grep -h "BLOCKED" artifacts/*/results.tsv 2>/dev/null || echo "aucun BLOCKED enregistré"

  # ---------------------------------------------------------------------------
  # P1 — parcours critique : catalogue -> gabarit -> brief -> caméra -> prises
  # -> export -> partage. Caméra VIRTUELLE de l'émulateur : la chaîne
  # CameraX -> MediaCodec -> MP4 est réelle, l'image est synthétique.
  # ---------------------------------------------------------------------------
  android-e2e-p1:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: APK debug
        run: ./gradlew :app:assembleDebug --stacktrace 2>&1 | tail -20
      - name: ffprobe (vérification du MP4 exporté)
        # `timeout` : une installation apt lente a coûté 20 minutes au run
        # 42212817413. ffmpeg n'est PAS indispensable au parcours : s'il manque,
        # on le dit et on continue (le contrôle MP4 reste fait par `ls`/taille).
        run: timeout 240 bash -c 'sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg' >/dev/null 2>&1 || echo "ffmpeg indisponible ou trop lent — ffprobe ignoré"
      - name: Activation KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
      - name: P1 catalogue -> export (caméra émulée)
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: default
          arch: x86_64
          profile: pixel_5
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back emulated -camera-front none
          script: |
            adb devices
            bash tools/e2e/run_p1.sh p1-debug app/build/outputs/apk/debug/app-debug.apk
            echo "=== ffprobe du MP4 exporté ==="
            # `|| true` : l'ABSENCE du MP4 est un résultat (échec de parcours), pas
            # une erreur de job. Sans ce garde-fou, le job passait « failure » même
            # quand le harnais avait tout mesuré — signal brouillé (runs 42219775013,
            # 42228009767).
            for f in artifacts/p1-debug/export.mp4; do
              if [ -s "$f" ]; then
                ffprobe -v error -show_entries format=duration,size,format_name -show_entries stream=codec_type,codec_name,width,height -of default=noprint_wrappers=1 "$f" | tee artifacts/p1-debug/ffprobe.txt
              else
                echo "aucun MP4 produit : l'échec est applicatif, pas technique" | tee artifacts/p1-debug/ffprobe.txt
              fi
            done
            true
      - name: Artefacts P1
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-p1
          path: artifacts/**
          retention-days: 14
          if-no-files-found: warn

  # ---------------------------------------------------------------------------
  # D42.17 — EXPORT SUR SIGNATURE OFFICIELLE (priorité absolue du fondateur).
  # Build RELEASE signé : keystore restauré des secrets fondateur (jamais dans
  # le dépôt), porte d'intégrité V2.0 §22 ACTIVE via -PvvApkSha256 (le certificat
  # attendu est l'officiel), contrôle apksigner (l'APK DOIT porter le certificat
  # officiel — clé debug interdite), puis CET APK est installé dans l'AVD et le
  # parcours P1 est rejoué jusqu'à l'export réel, au MP4, à ffprobe, au décodage
  # et au partage. IntegrityGuard n'est ni désactivé ni contourné : il est
  # SATISFAIT par la signature officielle. Sans secrets -> échec explicite (on
  # ne substitue JAMAIS une autre clé).
  # ---------------------------------------------------------------------------
  android-e2e-release-signed:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      VV_SIGNING: ${{ secrets.VV_KEYSTORE_B64 != '' && secrets.VV_STORE_PASSWORD != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Garde-fou secrets (aucune substitution de clé)
        if: env.VV_SIGNING != 'true'
        run: |
          echo "::error::D42.17 : secrets VV_KEYSTORE_B64 / VV_STORE_PASSWORD absents — release officielle impossible. Ne pas substituer une autre clé (ordre fondateur)."
          exit 1
      - name: Restauration keystore officiel (P0)
        env:
          VV_KEYSTORE_B64: ${{ secrets.VV_KEYSTORE_B64 }}
          VV_STORE_PASSWORD: ${{ secrets.VV_STORE_PASSWORD }}
        run: |
          set -euo pipefail
          mkdir -p vv-signing
          printf '%s' "$VV_KEYSTORE_B64" | base64 -d > vv-signing/vitrine.keystore
          {
            echo "storeFile=vitrine.keystore"
            echo "storePassword=$VV_STORE_PASSWORD"
            echo "keyAlias=vitrine"
            echo "keyPassword=$VV_STORE_PASSWORD"
          } > vv-signing/signing.properties
          chmod 600 vv-signing/vitrine.keystore vv-signing/signing.properties
      - name: Empreinte officielle SHA-256 (porte V2.0 §22)
        id: apksha
        run: |
          set -euo pipefail
          PASS=$(grep '^storePassword=' vv-signing/signing.properties | cut -d= -f2-)
          SHA=$(keytool -list -v -keystore vv-signing/vitrine.keystore -alias vitrine \
                -storepass "$PASS" | awk -F': ' '/SHA256:/ {print $2}' | tr -d ':' | tr 'A-Z' 'a-z')
          if [[ ${#SHA} -ne 64 ]]; then
            echo "::error::Extraction SHA-256 du keystore échouée (alias 'vitrine' attendu)."
            exit 1
          fi
          echo "sha256=$SHA" >> "$GITHUB_OUTPUT"
          # Empreinte officielle documentée en D42.14 (RC6, apksigner_verify.txt) :
          if [[ "$SHA" != "758077eb1388376d8ac797db88eec976b27f7a553dc09d6d85529fbd0b33e192" ]]; then
            echo "::error::Le keystore secret ne porte PAS le certificat officiel documenté (758077eb…33e192) — refus."
            exit 1
          fi
      - name: APK release (signé officiel + R8 + porte d'intégrité ACTIVE)
        run: ./gradlew :app:assembleRelease -PvvApkSha256=${{ steps.apksha.outputs.sha256 }} --stacktrace 2>&1 | tail -20
      - name: Contrôle apksigner (certificat APK == certificat officiel)
        run: |
          set -euo pipefail
          APK=$(ls app/build/outputs/apk/release/*.apk | head -1)
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          CERT=$("$APKSIGNER" verify --print-certs "$APK" \
                 | awk -F': ' '/certificate SHA-256 digest/ {print tolower($NF)}' | head -1)
          if [[ ${#CERT} -ne 64 ]]; then
            echo "::error::Extraction du SHA-256 de l'artifact échouée (lu : '$CERT')."
            exit 1
          fi
          echo "certificat APK      : $CERT"
          echo "certificat officiel : ${{ steps.apksha.outputs.sha256 }}"
          [[ "$CERT" == "${{ steps.apksha.outputs.sha256 }}" ]] || { echo "::error::Certificat de l'APK != certificat officiel."; exit 1; }
          sha256sum "$APK" | tee release_apk_sha256.txt
      - name: ffprobe (vérification + décodage du MP4 exporté)
        run: timeout 240 bash -c 'sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg' >/dev/null 2>&1 || echo "ffmpeg indisponible ou trop lent — ffprobe ignoré"
      - name: Activation KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
      - name: P1 export sur release officielle (caméra émulée)
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: default
          arch: x86_64
          profile: pixel_5
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back emulated -camera-front none
          script: |
            adb devices
            bash tools/e2e/run_p1.sh p1-release app/build/outputs/apk/release/app-release.apk
            echo "=== ffprobe + décodage complet du MP4 exporté ==="
            for f in artifacts/p1-release/export.mp4; do
              if [ -s "$f" ]; then
                ffprobe -v error -show_entries format=duration,size,format_name -show_entries stream=codec_type,codec_name,width,height -of default=noprint_wrappers=1 "$f" | tee artifacts/p1-release/ffprobe.txt
                echo "--- décodage intégral (lecture) ---" | tee -a artifacts/p1-release/ffprobe.txt
                ffprobe -v error -i "$f" -f null - 2>&1 | tee -a artifacts/p1-release/decode_check.txt
                echo "decode rc=$?" | tee -a artifacts/p1-release/decode_check.txt
              else
                echo "aucun MP4 produit : l'échec est applicatif, pas technique" | tee artifacts/p1-release/ffprobe.txt
              fi
            done
            true
      - name: Artefacts P1 release (MP4 + preuves + APK signé)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-p1-release
          path: |
            artifacts/**
            app/build/outputs/apk/release/*.apk
            release_apk_sha256.txt
          retention-days: 14
          if-no-files-found: warn

  # ---------------------------------------------------------------------------
  # D42.14 — Preuve des 4 LANGUES (P5) : chaque langue est sélectionnée dans
  # l'application, puis les écrans sont vérifiés dans CETTE langue jusqu'au
  # catalogue. Les libellés attendus sont ceux des ressources values-<langue>.
  # ---------------------------------------------------------------------------
  android-e2e-langues:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        langue: [en, es, ja]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: APK debug
        run: ./gradlew :app:assembleDebug --stacktrace 2>&1 | tail -20
      - name: Activation KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
      - name: Parcours encadré en ${{ matrix.langue }}
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: default
          arch: x86_64
          profile: pixel_5
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          script: |
            adb devices
            bash tools/e2e/run_langue.sh langue ${{ matrix.langue }} app/build/outputs/apk/debug/app-debug.apk
      - name: Artefacts langue ${{ matrix.langue }}
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-langue-${{ matrix.langue }}
          path: artifacts/**
          retention-days: 14
          if-no-files-found: warn

  # ---------------------------------------------------------------------------
  # D42.14 — Suite de sécurité COMPLÈTE en local (64 contrôles), sans Firebase.
  # IdP local + pont HTTP local ; Worker et base réels. Statut PASS_LOCAL_HARNESS.
  # ---------------------------------------------------------------------------
  security-local:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Suite de sécurité (64 contrôles)
        run: bash tools/e2e/run_security_local.sh artifacts/security/security_ci.txt
      - name: Artefact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: security-local
          path: artifacts/security/**
          retention-days: 14
          if-no-files-found: warn

  # ---------------------------------------------------------------------------
  # D42.14 — Autotest du harnais : le banc sait-il dire NON ?
  # Faux `adb`, vrai ui.py. Aucun émulateur, ~10 s.
  # ---------------------------------------------------------------------------
  harness-selftest:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Autotest du harnais (6 contrôles)
        run: python3 tools/e2e/selftest_harness.py
      - name: Ciblage hors appareil (3 contrôles)
        run: python3 tools/e2e/test_ciblage.py

  # ---------------------------------------------------------------------------
  # D42.14 — Contrat AUTHENTIFIÉ du Worker, sans compte Firebase ni secret.
  # Le Worker est importé tel quel ; seule la JWKS Google est remplacée, dans le
  # processus de test, par une clé locale. La base est une SQLite issue des 12
  # migrations. Aucune requête sortante, aucune donnée réelle.
  # ---------------------------------------------------------------------------
  auth-local:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Dépendances (jose, wrangler)
        run: npm install --no-audit --no-fund 2>&1 | tail -3
      - name: Contrat authentifié (18 contrôles)
        run: node tools/e2e/auth_harness.mjs --db /tmp/auth-d42.db --json artifacts/auth/auth_report.json
      - name: Artefact du banc
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: auth-local
          path: artifacts/auth/**
          retention-days: 14
          if-no-files-found: warn

  # ---------------------------------------------------------------------------
  # Backend HTTP — Worker réellement démarré (wrangler dev) sur une base D1
  # locale construite par les 12 migrations. Aucun accès réseau externe, aucune
  # donnée de production, aucun jeton Cloudflare.
  # ---------------------------------------------------------------------------
  backend-http:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Dépendances
        run: npm install --no-audit --no-fund 2>&1 | tail -5
      - name: Appliquer les 12 migrations sur D1 local
        run: |
          set -euo pipefail
          for m in db/migrations/*.sql; do
            echo "--- $m"
            npx wrangler d1 execute vitrine-video-db --local --file="$m" 2>&1 | tail -2
          done
          echo "=== tables ==="
          npx wrangler d1 execute vitrine-video-db --local             --command="SELECT name FROM sqlite_master WHERE type='table' AND name NOT LIKE 'sqlite_%' ORDER BY name" 2>&1 | tail -40
      - name: Démarrer le Worker local
        run: |
          set -euo pipefail
          echo '{"BILLING_WEBHOOK_SECRET":"d42-lab-secret"}' > .dev.vars
          nohup npx wrangler dev --local --ip 127.0.0.1 --port 8788 --show-interactive-dev-session=false             > /tmp/worker.log 2>&1 &
          echo $! > /tmp/worker.pid
          for i in $(seq 1 40); do
            if curl -sf http://127.0.0.1:8788/health >/dev/null 2>&1; then echo "Worker prêt"; exit 0; fi
            sleep 2
          done
          echo "::error::Worker non démarré"; tail -40 /tmp/worker.log; exit 1
      - name: Contrat HTTP
        run: python3 tools/e2e/http_contract.py http://127.0.0.1:8788 | tee http_run.txt
      - name: Arrêt
        if: always()
        run: |
          [ -f /tmp/worker.pid ] && kill "$(cat /tmp/worker.pid)" 2>/dev/null || true
          tail -30 /tmp/worker.log 2>/dev/null || true
      - name: Artefacts backend
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-http
          path: |
            http_contract_report.json
            http_run.txt
          retention-days: 14
          if-no-files-found: warn
