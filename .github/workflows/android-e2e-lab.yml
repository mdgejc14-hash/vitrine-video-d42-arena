name: android-e2e-lab

# Laboratoire Android distant D42.13 — exécute l'APK RÉEL sur un émulateur
# Android, sans aucun secret : l'APK est construit en debug (clé debug générée
# par le runner). Aucun keystore, aucun jeton, aucune donnée de production.
#
# Preuves produites : captures PNG, dumps uiautomator, logcat, résultats
# PASS/FAIL/BLOCKED par scénario, taille d'écran, variantes de police et de
# rotation, plus une exécution sur petit écran (profil Nexus S).

on:
  workflow_dispatch:
  push:
    branches: [d42.13-lab, main]

# D42.28 (P0) : clé Firebase RÉELLE injectée dans les APK debug du lab
# (identifiant client PUBLIC — embarqué dans toute APK distribuée ; la
# valeur ne paraît ni en commit ni dans les logs, et l'APK n'est jamais
# un artefact). Les bancs auth testent ainsi la même chaîne que la
# production ; le choix d'un vrai compte reste au fondateur.
env:
  ORG_GRADLE_PROJECT_vvFirebaseApiKey: ${{ secrets.FIREBASE_WEB_API_KEY }}

# Un seul laboratoire à la fois : un nouveau push annule la run précédente au
# lieu d'empiler des émulateurs inutiles (coût = temps de runner, pas d'argent).
concurrency:
  group: android-e2e-lab-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Assemblage de l'APK debug (sans secret)
        run: |
          set -o pipefail
          ./gradlew :app:assembleDebug --stacktrace 2>&1 | tail -60
          ls -la app/build/outputs/apk/debug/

      - name: Empreinte de l'APK testé
        run: |
          sha256sum app/build/outputs/apk/debug/app-debug.apk | tee apk_sha256.txt
          echo "commit=$(git rev-parse HEAD)" | tee -a apk_sha256.txt

      - name: Activation KVM (accélération matérielle de l'émulateur)
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -l /dev/kvm || echo "KVM ABSENT"

      # ---------------------------------------------------------------------
      # Configuration 1 — téléphone standard (Pixel 5, 1080x2340, 420 dpi)
      #   a) parcours nominal  b) police 130 %  c) rotation paysage
      # ---------------------------------------------------------------------
      - name: Parcours P0 — Pixel 5 (nominal + police + rotation)
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: default
          arch: x86_64
          profile: pixel_5
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -camera-front none
          script: |
            adb devices
            bash tools/e2e/run_p0.sh pixel5 base
            bash tools/e2e/run_p0.sh pixel5 font130
            bash tools/e2e/run_p0.sh pixel5 rot90

      - name: Capture des artefacts Pixel 5
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-pixel5
          path: |
            artifacts/**
            apk_sha256.txt
          retention-days: 14
          if-no-files-found: warn

      # ---------------------------------------------------------------------
      # Configuration 2 — petit écran (540x960 @ 240 dpi), simulé sur l'AVD
      # stable : c'est la configuration où le défaut P1 « bouton hors écran »
      # se manifestait. Le profil Nexus S a été abandonné : l'image API 30 ne
      # démarre pas sur ce profil (constaté au run 42175579512, étape bloquée).
      # ---------------------------------------------------------------------
      - name: Parcours P0 — petit écran 540x960 (simulé sur Pixel 5)
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: default
          arch: x86_64
          profile: pixel_5
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -camera-front none
          script: |
            adb devices
            bash tools/e2e/run_p0.sh petit_ecran small
            bash tools/e2e/run_p0.sh petit_ecran font130

      - name: Capture des artefacts petit écran
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-petit-ecran
          path: artifacts/**
          retention-days: 14
          if-no-files-found: warn

      - name: Bilan agrégé
        if: always()
        run: |
          echo "=== BILAN PAR VARIANTE ==="
          for f in artifacts/*/summary.txt; do
            [ -f "$f" ] || continue
            echo "--- $f"; cat "$f"
          done
          echo "=== ÉCHECS ==="
          grep -h "FAIL" artifacts/*/results.tsv 2>/dev/null || echo "aucun FAIL enregistré"
          echo "=== BLOQUÉS ==="
          grep -h "BLOCKED" artifacts/*/results.tsv 2>/dev/null || echo "aucun BLOCKED enregistré"

  # ---------------------------------------------------------------------------
  # P1 — parcours critique : catalogue -> gabarit -> brief -> caméra -> prises
  # -> export -> partage. Caméra VIRTUELLE de l'émulateur : la chaîne
  # CameraX -> MediaCodec -> MP4 est réelle, l'image est synthétique.
  # ---------------------------------------------------------------------------
  android-e2e-p1:
    runs-on: ubuntu-latest
    # D42.30-11 : 90 min coupait le banc AVANT le verdict (cancelled en
    # 5082856, 8c9f514, 09d3e74, 05ca482). D42.30-13 : 135 min — l'export
    # avec BGM a ABOUTI au-delà de 75 min sur run propre (lab 401ce39 :
    # export-0.mp4 5 084 798 o valides) ; fenêtre d'attente portée à 95 min.
    timeout-minutes: 135
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: APK debug
        run: ./gradlew :app:assembleDebug --stacktrace 2>&1 | tail -20
      - name: ffprobe (vérification du MP4 exporté)
        # `timeout` : une installation apt lente a coûté 20 minutes au run
        # 42212817413. ffmpeg n'est PAS indispensable au parcours : s'il manque,
        # on le dit et on continue (le contrôle MP4 reste fait par `ls`/taille).
        run: timeout 240 bash -c 'sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg' >/dev/null 2>&1 || echo "ffmpeg indisponible ou trop lent — ffprobe ignoré"
      - name: Activation KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
      - name: P1 catalogue -> export (caméra émulée)
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: default
          arch: x86_64
          profile: pixel_5
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back emulated -camera-front emulated
          script: |
            adb devices
            bash tools/e2e/run_p1.sh p1-debug app/build/outputs/apk/debug/app-debug.apk
            echo "=== ffprobe du MP4 exporté ==="
            # D42.21-12 : bloc sur UNE SEULE LIGNE — l'emulator-runner exécute le
            # script LIGNE PAR LIGNE via `sh -c` : un `for ... done` multi-lignes
            # est coupé et meurt en « Syntax error: end of file unexpected »
            # (prouvé run 42435516694 : parcours 36/36 PASS mais step rouge).
            # `|| true` : l'ABSENCE du MP4 est un résultat (échec de parcours), pas
            # une erreur de job. Sans ce garde-fou, le job passait « failure » même
            # quand le harnais avait tout mesuré — signal brouillé (runs 42219775013,
            # 42228009767).
            if [ -s artifacts/p1-debug/export.mp4 ]; then ffprobe -v error -show_entries format=duration,size,format_name -show_entries stream=codec_type,codec_name,width,height -of default=noprint_wrappers=1 artifacts/p1-debug/export.mp4 | tee artifacts/p1-debug/ffprobe.txt || true; else echo "aucun MP4 produit : l'échec est applicatif, pas technique" | tee artifacts/p1-debug/ffprobe.txt; fi
            true
      - name: Artefacts P1
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-p1
          path: artifacts/**
          retention-days: 14
          if-no-files-found: warn

  # ---------------------------------------------------------------------------
  # D42.26-18 — CAMÉRA RÉSILIENTE (§13-E) : permissions refusées (5.6),
  # « Refaire » = suppression/reprise d'une prise (5.2), conservation des
  # prises en fichiers (5.3). PASS_EMULATOR (caméra virtuelle), jamais
  # PASS_DEVICE. Pas d'export ici (couvert par le P1).
  # ---------------------------------------------------------------------------
  android-e2e-camerap:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: APK debug
        run: ./gradlew :app:assembleDebug --stacktrace 2>&1 | tail -20
      - name: Activation KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
      - name: Caméra résiliente (permissions + Refaire)
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: default
          arch: x86_64
          profile: pixel_5
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back emulated -camera-front emulated
          script: |
            adb devices
            bash tools/e2e/run_camerap.sh camerap-debug app/build/outputs/apk/debug/app-debug.apk
            true
      - name: Artefacts camerap
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-camerap
          path: artifacts/**
          retention-days: 14
          if-no-files-found: warn

  # ---------------------------------------------------------------------------
  # D42.32 (Lot 3, P0) — DIAGNOSTIC DIFFÉRENTIEL DE LA MOSAÏQUE CAMÉRA :
  # les QUATRE sources mesurées indépendamment (ImageAnalysis, rendu
  # PreviewView, fichier VideoCapture, MP4 décodé) sur caméra ÉMULÉE,
  # dans les deux modes PreviewView (PERFORMANCE=SurfaceView,
  # COMPATIBLE=TextureView). Preuves : rapport JSON + PNG par mode.
  # RÉSULTATS D'ÉMULATEUR identifiés comme tels dans le rapport (champ
  # « emulateur ») — la validation capteur PHYSIQUE reste au fondateur
  # (même banc via am instrument sur téléphone branché, cf.
  # docs/checkpoints/D42_32/06_CAMERA_DIAGNOSTIC.md).
  # ---------------------------------------------------------------------------
  camera-diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: APK debug + APK de test
        run: |
          ./gradlew :app:assembleDebug :app:assembleDebugAndroidTest --stacktrace 2>&1 | tail -20
          ls -la app/build/outputs/apk/debug/ app/build/outputs/apk/androidTest/debug/
      - name: Activation KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
      - name: Diagnostic 4 sources (caméra émulée, modes performance+compatible)
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: default
          arch: x86_64
          profile: pixel_5
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back emulated -camera-front emulated
          script: |
            adb devices
            mkdir -p artifacts/camera-diagnostic
            adb install -r app/build/outputs/apk/debug/app-debug.apk
            adb install -r app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
            # D42.32 §5 (v2, recréé post-rollback) : adbd ROOT sur émulateur —
            # sans cela, adb pull du stockage app-scoped est REFUSÉ (API 30,
            # scoped storage) et l'artéfact ne contient que instrument.txt (300 o).
            adb root
            adb wait-for-device
            adb shell pm grant video.vitrine.app android.permission.CAMERA || true
            adb shell am instrument -w -e class video.vitrine.d42.CameraMosaicDiagnosticTest video.vitrine.app.test/androidx.test.runner.AndroidJUnitRunner > artifacts/camera-diagnostic/instrument.txt 2>&1
            tail -25 artifacts/camera-diagnostic/instrument.txt
            grep -q "OK (2 tests)" artifacts/camera-diagnostic/instrument.txt || exit 1
            # Laisser les écritures PNG/JSON se vider avant la copie autorisée.
            sleep 3
            echo "=== contenu app-scoped avant copie ==="
            adb shell ls -la /sdcard/Android/data/video.vitrine.app/files/d42/camera-diagnostic/ | tee artifacts/camera-diagnostic/ls_avant_copie.txt
            adb pull /sdcard/Android/data/video.vitrine.app/files/d42/camera-diagnostic/. artifacts/camera-diagnostic/ >> artifacts/camera-diagnostic/copie.txt 2>&1
            echo "=== copié ==="; cat artifacts/camera-diagnostic/copie.txt | tail -5
            # VÉRIFICATION TAILLE + CONTENU RÉELS (compile ≠ terminé) :
            # 2 rapports JSON (performance+compatible) contenant chacun les
            # 4 sources, emulateur=true, luminance et quadrants ; PNG de preuve.
            python3 - <<'PY'
            import glob, json, os, sys
            rapports = sorted(glob.glob("artifacts/camera-diagnostic/rapport-*.json"))
            pngs = sorted(glob.glob("artifacts/camera-diagnostic/*.png"))
            if len(rapports) < 2:
                print(f"::error::rapports JSON manquants ({len(rapports)} < 2) — récupération en échec"); sys.exit(1)
            if not pngs:
                print("::error::aucun PNG de preuve récupéré"); sys.exit(1)
            for r in rapports:
                taille = os.path.getsize(r)
                if taille < 500:
                    print(f"::error::{r} trop petit ({taille} o) — rapport tronqué"); sys.exit(1)
                d = json.load(open(r, encoding="utf-8"))
                src = d.get("sources", {})
                for s in ("image_analysis", "preview_view", "video_capture", "mp4_decode"):
                    if s not in src:
                        print(f"::error::{r} : source {s} absente"); sys.exit(1)
                if not d.get("appareil", {}).get("emulateur"):
                    print(f"::error::{r} : emulateur=true absent (identification honnête exigée)"); sys.exit(1)
                print(f"OK {os.path.basename(r)} : {taille} o, 4 sources, emulateur=true")
            print(f"CAMERA-DIAGNOSTIC BILAN : {len(rapports)} rapports, {len(pngs)} PNG")
            PY
      - name: Artefacts du diagnostic
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: camera-diagnostic
          path: |
            artifacts/camera-diagnostic/**
          retention-days: 30
          if-no-files-found: warn

  # ---------------------------------------------------------------------------
  # D42.27 (§7) — BROUILLONS INTER-SESSIONS : S1 saisie partielle fermée
  # brutalement ; S2 première scène filmée puis force-stop SANS réseau ;
  # reprise à la bonne prise, rushs conservés ; S3 fin du montage ; S4 retour
  # réseau. Preuves fichiers (rushs) + dumps, jamais le seul libellé.
  # ---------------------------------------------------------------------------
  android-e2e-drafts:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: APK debug
        run: ./gradlew :app:assembleDebug --stacktrace 2>&1 | tail -20
      - name: Activation KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
      - name: Brouillons inter-sessions
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: default
          arch: x86_64
          profile: pixel_5
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back emulated -camera-front emulated
          script: |
            adb devices
            bash tools/e2e/run_drafts.sh drafts-debug app/build/outputs/apk/debug/app-debug.apk
            true
      - name: Artefacts drafts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-drafts
          path: artifacts/**
          retention-days: 14
          if-no-files-found: warn

  # ---------------------------------------------------------------------------
  # D42.27 (§2, audit E) — AUTH GOOGLE RÉELLE AU LAB : vrai flux Credential
  # Manager (bottom sheet GMS OU réponse « aucun compte »), annulation propre,
  # re-soumission, repli démo intact, zéro crash. Le choix d'un VRAI compte
  # reste fondateur (aucune simulation de connexion réussie).
  # ---------------------------------------------------------------------------
  android-e2e-auth:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: APK debug
        run: ./gradlew :app:assembleDebug --stacktrace 2>&1 | tail -20
      - name: Activation KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
      - name: Auth Google réelle (Credential Manager)
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: playstore
          arch: x86_64
          profile: pixel_5
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back emulated -camera-front emulated
          script: |
            adb devices
            bash tools/e2e/run_auth.sh auth-debug app/build/outputs/apk/debug/app-debug.apk
            true
      - name: Artefacts auth
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-auth
          path: artifacts/**
          retention-days: 14
          if-no-files-found: warn

  # ---------------------------------------------------------------------------
  # D42.27 (§3, audit F) — DEEP-LINK PARRAINAGE BOUT-EN-BOUT : lien
  # https://vitrine.video/r/CODE → auth (code affiché) → onboarding (champ
  # pré-rempli, D42.27-08) → catalogue. L'attribution serveur est déjà
  # prouvée par les bancs API 8.3-8.7.
  # ---------------------------------------------------------------------------
  android-e2e-deeplink:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: APK debug
        run: ./gradlew :app:assembleDebug --stacktrace 2>&1 | tail -20
      - name: Activation KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
      - name: Deep-link parrainage
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: default
          arch: x86_64
          profile: pixel_5
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back emulated -camera-front emulated
          script: |
            adb devices
            bash tools/e2e/run_deeplink.sh deeplink-debug app/build/outputs/apk/debug/app-debug.apk
            true
      - name: Artefacts deeplink
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-deeplink
          path: artifacts/**
          retention-days: 14
          if-no-files-found: warn

  # ---------------------------------------------------------------------------
  # D42.17 — EXPORT SUR SIGNATURE OFFICIELLE : déplacé vers
  # release-official-build.yml (étage 1 : build sans secret, tag d42.17-build-*)
  # et release-official-e2e.yml (étage 3 : validation de l'artefact signé,
  # tag d42.17-rc*). Décision fondateur : AUCUN secret de signature sur le
  # miroir public — la clé officielle reste hors du dépôt, seul l'artefact
  # signé est transmis (re-signature locale = étage 2, hors CI). Voir
  # docs/checkpoints/D42_17/01_OPTIONS_SIGNATURE.md.
  # ---------------------------------------------------------------------------

  # ---------------------------------------------------------------------------
  # D42.14 — Preuve des LANGUES (P5) : chaque langue est sélectionnée dans
  # l'application, puis les écrans sont vérifiés dans CETTE langue jusqu'au
  # catalogue. D42.30 : FR/EN uniquement (le FR est couvert par la suite
  # principale run_p0/p1/camerap ; ce job prouve l'EN).
  # ---------------------------------------------------------------------------
  android-e2e-langues:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        langue: [en] # D42.30 : FR/EN uniquement (ES/JA retirés du produit)
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: APK debug
        run: ./gradlew :app:assembleDebug --stacktrace 2>&1 | tail -20
      - name: Activation KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
      - name: Parcours encadré en ${{ matrix.langue }}
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: default
          arch: x86_64
          profile: pixel_5
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          script: |
            adb devices
            bash tools/e2e/run_langue.sh langue ${{ matrix.langue }} app/build/outputs/apk/debug/app-debug.apk
      - name: Artefacts langue ${{ matrix.langue }}
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-langue-${{ matrix.langue }}
          path: artifacts/**
          retention-days: 14
          if-no-files-found: warn

  # ---------------------------------------------------------------------------
  # D42.14 — Suite de sécurité COMPLÈTE en local (64 contrôles), sans Firebase.
  # IdP local + pont HTTP local ; Worker et base réels. Statut PASS_LOCAL_HARNESS.
  # ---------------------------------------------------------------------------
  # ---------------------------------------------------------------------------
  # OFFLINE (D42.26 action B) — qualification explicite hors connexion :
  # le réseau de l'ÉMULATEUR est coupé par adb (svc wifi/data disable) avant
  # le premier lancement ; le runner garde Internet. Lancement sans réseau,
  # écrans locaux, tentative Google sans crash, repli démo, carrousel, secteur,
  # bienvenue (seed local), catalogue, fermeture/relance, retour réseau.
  # ---------------------------------------------------------------------------
  android-e2e-offline:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Assemblage de l'APK debug (sans secret) + empreinte
        run: |
          set -o pipefail
          ./gradlew :app:assembleDebug --stacktrace 2>&1 | tail -40
          ls -la app/build/outputs/apk/debug/
          sha256sum app/build/outputs/apk/debug/app-debug.apk | tee apk_sha256.txt

      - name: Activation KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -l /dev/kvm || echo "KVM ABSENT"

      - name: Parcours OFFLINE — réseau coupé avant le premier lancement
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: default
          arch: x86_64
          profile: pixel_5
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -camera-front none
          script: |
            adb devices
            bash tools/e2e/run_offline.sh pixel5

      - name: Capture des artefacts offline
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-offline
          path: |
            artifacts/**
            apk_sha256.txt
          retention-days: 14
          if-no-files-found: warn

  # ---------------------------------------------------------------------------
  # D42.28 (P2-A) — EXPORT COMPLET HORS CONNEXION : réseau ON au départ
  # (pré-téléchargement du BGM à la sélection du gabarit), coupé par un
  # surveillant dès que le BGM est en cache, puis brief → tournage →
  # aperçu → EXPORT MP4 sans Internet. Preuves : coupure horodatée,
  # connectivité, MP4 + ffprobe + décodage, journal d'export (Room),
  # retour réseau sans perte ni crash.
  # ---------------------------------------------------------------------------
  android-e2e-offline-export:
    runs-on: ubuntu-latest
    # D42.28-26 : 110 min — l'export AVEC BGM réelle (fix configure du
    # BgmDecoder) est ~3x plus lent sur l'émulateur swiftshader : >40 min
    # observées (lab 42811778574 coupé au timeout 60 min 29 s avant le
    # verdict interne du banc). Setup+parcours ~20 min + export <=75 min
    # + vérifications OFFX ~6 min.
    timeout-minutes: 135
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Assemblage de l'APK debug + empreinte
        run: |
          set -o pipefail
          ./gradlew :app:assembleDebug --stacktrace 2>&1 | tail -40
          ls -la app/build/outputs/apk/debug/
          sha256sum app/build/outputs/apk/debug/app-debug.apk | tee apk_sha256.txt

      - name: Activation KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -l /dev/kvm || echo "KVM ABSENT"

      # ffmpeg pour ffprobe/décodage des preuves OFFX (best-effort, même
      # garde-fou que le job P1 : le parcours n'en dépend pas).
      - name: ffmpeg (preuves ffprobe/decode)
        run: timeout 240 bash -c 'sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg' >/dev/null 2>&1 || echo "ffmpeg indisponible ou trop lent — ffprobe ignoré"

      - name: Export hors connexion (BGM en cache puis réseau coupé)
        uses: reactivecircus/android-emulator-runner@v2
        env:
          # D42.28-16 : le banc télécharge la piste titulaire via le compte
          # sonde (REST) pour l'injecter en cache local — le produit ne
          # télécharge pas le BGM en session démo (sans jeton Firebase).
          FIREBASE_WEB_API_KEY: ${{ secrets.FIREBASE_WEB_API_KEY }}
          API_BASE_URL: ${{ vars.API_BASE_URL_PROD }}
        with:
          api-level: 30
          target: default
          arch: x86_64
          profile: pixel_5
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back emulated -camera-front none
          script: |
            adb devices
            bash tools/e2e/run_offline_export.sh offline-export app/build/outputs/apk/debug/app-debug.apk
            true

      - name: Capture des artefacts offline-export
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-offline-export
          path: |
            artifacts/offline-export/**
            apk_sha256.txt
          retention-days: 14
          if-no-files-found: warn

  # ---------------------------------------------------------------------------
  # GABARITS (D42.26 action F) — audit de contenu STATIQUE des 30 gabarits
  # (6 secteurs × T1-T5) : catalogue, séquences, ordre, textes/variables,
  # prises, guide de tournage, musique/SFX, 3 modes audio, politique de
  # saisie, transitions/effets, structure de montage, ratio, manifeste SHA.
  # Aucun émulateur, ~5 s. Ne modifie AUCUN contenu.
  # ---------------------------------------------------------------------------
  gabarits-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Audit des 30 gabarits (817 contrôles)
        run: python3 tools/e2e/audit_gabarits.py
      - name: Artefact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gabarits-audit
          path: artifacts/gabarits-audit/**
          retention-days: 14
          if-no-files-found: warn

  security-local:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Suite de sécurité (64 contrôles)
        run: bash tools/e2e/run_security_local.sh artifacts/security/security_ci.txt
      - name: Artefact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: security-local
          path: artifacts/security/**
          retention-days: 14
          if-no-files-found: warn

  # ---------------------------------------------------------------------------
  # D42.14 — Autotest du harnais : le banc sait-il dire NON ?
  # Faux `adb`, vrai ui.py. Aucun émulateur, ~10 s.
  # ---------------------------------------------------------------------------
  harness-selftest:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Autotest du harnais (6 contrôles)
        run: python3 tools/e2e/selftest_harness.py
      - name: Ciblage hors appareil (3 contrôles)
        run: python3 tools/e2e/test_ciblage.py

  # ---------------------------------------------------------------------------
  # D42.14 — Contrat AUTHENTIFIÉ du Worker, sans compte Firebase ni secret.
  # Le Worker est importé tel quel ; seule la JWKS Google est remplacée, dans le
  # processus de test, par une clé locale. La base est une SQLite issue des 12
  # migrations. Aucune requête sortante, aucune donnée réelle.
  # ---------------------------------------------------------------------------
  auth-local:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Dépendances (jose, wrangler)
        run: npm install --no-audit --no-fund 2>&1 | tail -3
      - name: Contrat authentifié (18 contrôles)
        run: node tools/e2e/auth_harness.mjs --db /tmp/auth-d42.db --json artifacts/auth/auth_report.json
      - name: Artefact du banc
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: auth-local
          path: artifacts/auth/**
          retention-days: 14
          if-no-files-found: warn

  # ---------------------------------------------------------------------------
  # Backend HTTP — Worker réellement démarré (wrangler dev) sur une base D1
  # locale construite par les migrations du dépôt. Aucun accès réseau externe, aucune
  # donnée de production, aucun jeton Cloudflare.
  # ---------------------------------------------------------------------------
  backend-http:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Dépendances
        run: npm install --no-audit --no-fund 2>&1 | tail -5
      - name: Appliquer les migrations du dépôt sur D1 local
        run: |
          set -euo pipefail
          for m in db/migrations/*.sql; do
            echo "--- $m"
            npx wrangler d1 execute vitrine-video-db --local --file="$m" 2>&1 | tail -2
          done
          echo "=== tables ==="
          npx wrangler d1 execute vitrine-video-db --local             --command="SELECT name FROM sqlite_master WHERE type='table' AND name NOT LIKE 'sqlite_%' ORDER BY name" 2>&1 | tail -40
      - name: Démarrer le Worker local
        run: |
          set -euo pipefail
          echo '{"BILLING_WEBHOOK_SECRET":"d42-lab-secret"}' > .dev.vars
          nohup npx wrangler dev --local --ip 127.0.0.1 --port 8788 --show-interactive-dev-session=false             > /tmp/worker.log 2>&1 &
          echo $! > /tmp/worker.pid
          for i in $(seq 1 40); do
            if curl -sf http://127.0.0.1:8788/health >/dev/null 2>&1; then echo "Worker prêt"; exit 0; fi
            sleep 2
          done
          echo "::error::Worker non démarré"; tail -40 /tmp/worker.log; exit 1
      - name: Contrat HTTP
        run: python3 tools/e2e/http_contract.py http://127.0.0.1:8788 | tee http_run.txt
      - name: Contrat quota (décisions pures — D42.32 §4)
        run: node tools/e2e/quota_unit.mjs | tee quota_run.txt
      - name: Arrêt
        if: always()
        run: |
          [ -f /tmp/worker.pid ] && kill "$(cat /tmp/worker.pid)" 2>/dev/null || true
          tail -30 /tmp/worker.log 2>/dev/null || true
      - name: Artefacts backend
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-http
          path: |
            http_contract_report.json
            http_run.txt
            quota_run.txt
          retention-days: 14
          if-no-files-found: warn
