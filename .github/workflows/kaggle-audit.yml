name: kaggle-audit

# D42.34 (ordre fondateur du 16/11/2026) — GitHub Actions = CONTRÔLEUR.
# Kaggle = exécution des calculs lourds (audit + compilation PRE-SIGN).
# Le notebook <username>/vitrine-video-d42-34-validation clone le miroir
# public au SHA exact du HEAD, exécute tests/ktlint/detekt/checkModuleGraph/
# audits puis :app:assembleRelease versionCode 3 (porte d'intégrité) → APK
# PRE-SIGN (clé debug de recette, NON installable). La re-signature officielle
# (keystore historique, empreinte 758077eb…33e192) est réalisée UNIQUEMENT
# dans l'environnement de confiance D42.17 — jamais ici.
# Pilotage : envoi unique + vérification réelle + reprise sans re-push +
# erreur exacte si échec + fichiers attendus vérifiés avant succès.
on:
  workflow_dispatch:
  push:
    branches: [d42.34-founder-acceptance-fixes]
    paths:
      - 'tools/kaggle/**'
      - '.github/workflows/kaggle-audit.yml'

permissions:
  contents: write

concurrency:
  group: kaggle-audit
  cancel-in-progress: false

jobs:
  pilot:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    outputs:
      etat: ${{ steps.pilot.outputs.etat }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Pré-vol secrets Kaggle (échec clair si absents)
        env:
          KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
          KAGGLE_KEY: ${{ secrets.KAGGLE_KEY }}
        run: |
          set -u
          if [ -z "${KAGGLE_USERNAME:-}" ] || [ -z "${KAGGLE_KEY:-}" ]; then
            echo "::error::Secrets KAGGLE_USERNAME / KAGGLE_KEY manquants (Settings → Secrets and variables → Actions)."
            exit 1
          fi
          echo "PASS : secrets Kaggle présents (valeurs jamais affichées)."

      - name: Détection du mécanisme d'authentification Kaggle
        env:
          KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
          KAGGLE_KEY: ${{ secrets.KAGGLE_KEY }}
        run: |
          set -euo pipefail
          mkdir -p ~/.kaggle
          chmod 700 ~/.kaggle
          sonde() { kaggle kernels list --user "$KAGGLE_USERNAME" >/dev/null 2>&1; }
          pip install --quiet "kaggle==2.2.5" six
          printf '%s' "$KAGGLE_KEY" > ~/.kaggle/access_token
          chmod 600 ~/.kaggle/access_token
          rm -f ~/.kaggle/kaggle.json
          if sonde; then
            echo "token" > ~/.kaggle/MODE
            echo "PASS : authentification Kaggle par token (CLI 2.2.5, access_token)."
            exit 0
          fi
          pip install --quiet "kaggle==1.7.4.5"
          rm -f ~/.kaggle/access_token
          printf '{"username":"%s","key":"%s"}\n' "$KAGGLE_USERNAME" "$KAGGLE_KEY" > ~/.kaggle/kaggle.json
          chmod 600 ~/.kaggle/kaggle.json
          if sonde; then
            echo "classique" > ~/.kaggle/MODE
            echo "PASS : authentification Kaggle par kaggle.json (CLI 1.7.4.5)."
            exit 0
          fi
          echo "::error title=BLOQUÉ::Identifiants Kaggle refusés par l'API (401) dans les DEUX mécanismes. Régénérer le token sur https://www.kaggle.com/settings (API) puis mettre à jour les secrets."
          exit 1

      - name: Préparation du notebook au SHA exact (title préservé)
        env:
          KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
        run: |
          set -euo pipefail
          SHA=$(git rev-parse HEAD)
          echo "SHA audité : $SHA"
          echo "SHA_NOTEBOOK=$SHA" >> "$GITHUB_ENV"
          mkdir -p pushdir kmeta
          sed "s/__SHA_EXACT__/$SHA/" tools/kaggle/vitrine_video_d42_34_validation.py > pushdir/script.py
          # Title : si le kernel existe déjà, préserver SON title réel
          # (kaggle kernels pull -m) ; sinon title OBLIGATOIRE pour un nouveau
          # kernel (l'erreur « New kernels must have a title specified » est
          # définitivement corrigée).
          TITLE="Vitrine Video D42 34 Validation"
          if kaggle kernels pull "$KAGGLE_USERNAME/vitrine-video-d42-34-validation" -m -p kmeta >/dev/null 2>&1 \
             && [ -f kmeta/kernel-metadata.json ]; then
            T=$(python3 -c "import json;print(json.load(open('kmeta/kernel-metadata.json')).get('title') or '')")
            if [ -n "$T" ]; then TITLE="$T"; fi
          fi
          python3 tools/kaggle/preparer_metadata.py "$KAGGLE_USERNAME" "$TITLE"
          bash -n tools/kaggle/pilotage.sh && echo "pilotage.sh syntaxe OK"

      - name: Pilotage du kernel (envoi unique, suivi, reprise)
        id: pilot
        env:
          KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
        run: bash tools/kaggle/pilotage.sh 16200 pushdir

      - name: Artefact des sorties Kaggle (30 jours)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kaggle-audit-output
          path: |
            kaggle-output/**
            push_result.txt
            kmeta/kernel-metadata.json
          retention-days: 30
          if-no-files-found: warn

      - name: Commit du rapport + checkpoint (branche uniquement)
        if: always() && hashFiles('kaggle-output/REPORT_KAGGLE_D42_34.md') != ''
        env:
          ETAT_PILOTAGE: ${{ steps.pilot.outputs.etat }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git pull --rebase origin d42.34-founder-acceptance-fixes
          cp kaggle-output/REPORT_KAGGLE_D42_34.md REPORT_KAGGLE_D42_34.md
          cp kaggle-output/apk_presign_sha256.txt apk_presign_sha256.txt 2>/dev/null || true
          cp kaggle-output/build_rapport.txt build_rapport.txt 2>/dev/null || true
          cp kaggle-output/tests_par_module.txt tests_par_module.txt 2>/dev/null || true
          SHA=$(git rev-parse HEAD)
          NOTEBOOK=$(grep -oE "version [0-9]+" push_result.txt 2>/dev/null | head -1 || echo "reprise (sans re-push)")
          RUN_URL="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          python3 tools/kaggle/commit_rapport.py "$SHA" "${ETAT_PILOTAGE:-INCONNU}" "$RUN_URL" "$NOTEBOOK"
          # D42.34 (run 11) : git add est ATOMIQUE — un pathspec absent (ex.
          # build_rapport.txt non produit) faisait échouer TOUT le add et le
          # commit rendait « no changes added » (exit 1). Ajout fichier par
          # fichier, seulement s'il existe.
          for f in REPORT_KAGGLE_D42_34.md apk_presign_sha256.txt build_rapport.txt tests_par_module.txt CHECKPOINT_D42_34_VALIDATION.md; do
            [ -f "$f" ] && git add "$f"
          done
          git commit -m "D42.34-D : audit+build Kaggle — rapport + checkpoint (état : ${ETAT_PILOTAGE:-INCONNU})" || true
          git push origin HEAD:d42.34-founder-acceptance-fixes

  resume:
    needs: pilot
    if: always() && needs.pilot.outputs.etat == 'EN_COURS'
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Détection du mécanisme d'authentification Kaggle
        env:
          KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
          KAGGLE_KEY: ${{ secrets.KAGGLE_KEY }}
        run: |
          set -euo pipefail
          mkdir -p ~/.kaggle
          chmod 700 ~/.kaggle
          sonde() { kaggle kernels list --user "$KAGGLE_USERNAME" >/dev/null 2>&1; }
          pip install --quiet "kaggle==2.2.5" six
          printf '%s' "$KAGGLE_KEY" > ~/.kaggle/access_token
          chmod 600 ~/.kaggle/access_token
          rm -f ~/.kaggle/kaggle.json
          if sonde; then
            echo "token" > ~/.kaggle/MODE
            echo "PASS : authentification Kaggle par token (CLI 2.2.5)."
            exit 0
          fi
          pip install --quiet "kaggle==1.7.4.5"
          rm -f ~/.kaggle/access_token
          printf '{"username":"%s","key":"%s"}\n' "$KAGGLE_USERNAME" "$KAGGLE_KEY" > ~/.kaggle/kaggle.json
          chmod 600 ~/.kaggle/kaggle.json
          if sonde; then
            echo "classique" > ~/.kaggle/MODE
            echo "PASS : authentification Kaggle par kaggle.json (CLI 1.7.4.5)."
            exit 0
          fi
          echo "::error title=BLOQUÉ::Identifiants Kaggle refusés — voir job pilot."
          exit 1

      - name: Préparation du notebook (reprise — title préservé)
        env:
          KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
        run: |
          set -euo pipefail
          SHA=$(git rev-parse HEAD)
          echo "SHA_NOTEBOOK=$SHA" >> "$GITHUB_ENV"
          mkdir -p pushdir kmeta
          sed "s/__SHA_EXACT__/$SHA/" tools/kaggle/vitrine_video_d42_34_validation.py > pushdir/script.py
          TITLE="Vitrine Video D42 34 Validation"
          if kaggle kernels pull "$KAGGLE_USERNAME/vitrine-video-d42-34-validation" -m -p kmeta >/dev/null 2>&1 \
             && [ -f kmeta/kernel-metadata.json ]; then
            T=$(python3 -c "import json;print(json.load(open('kmeta/kernel-metadata.json')).get('title') or '')")
            if [ -n "$T" ]; then TITLE="$T"; fi
          fi
          python3 tools/kaggle/preparer_metadata.py "$KAGGLE_USERNAME" "$TITLE"

      - name: Reprise du suivi (sans re-push si en cours)
        id: pilot
        env:
          KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
        run: bash tools/kaggle/pilotage.sh 16200 pushdir

      - name: Artefact des sorties Kaggle (30 jours, suite)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kaggle-audit-output-resume
          path: |
            kaggle-output/**
            push_result.txt
          retention-days: 30
          if-no-files-found: warn

      - name: Commit du rapport + checkpoint (branche uniquement)
        if: always() && hashFiles('kaggle-output/REPORT_KAGGLE_D42_34.md') != ''
        env:
          ETAT_PILOTAGE: ${{ steps.pilot.outputs.etat }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git pull --rebase origin d42.34-founder-acceptance-fixes
          cp kaggle-output/REPORT_KAGGLE_D42_34.md REPORT_KAGGLE_D42_34.md
          cp kaggle-output/apk_presign_sha256.txt apk_presign_sha256.txt 2>/dev/null || true
          cp kaggle-output/build_rapport.txt build_rapport.txt 2>/dev/null || true
          cp kaggle-output/tests_par_module.txt tests_par_module.txt 2>/dev/null || true
          SHA=$(git rev-parse HEAD)
          NOTEBOOK=$(grep -oE "version [0-9]+" push_result.txt 2>/dev/null | head -1 || echo "reprise (sans re-push)")
          RUN_URL="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          python3 tools/kaggle/commit_rapport.py "$SHA" "${ETAT_PILOTAGE:-INCONNU}" "$RUN_URL" "$NOTEBOOK"
          git add REPORT_KAGGLE_D42_34.md apk_presign_sha256.txt build_rapport.txt tests_par_module.txt CHECKPOINT_D42_34_VALIDATION.md 2>/dev/null || true
          git commit -m "D42.34-D : audit+build Kaggle (reprise) — rapport + checkpoint (état : ${ETAT_PILOTAGE:-INCONNU})"
          git push origin HEAD:d42.34-founder-acceptance-fixes
