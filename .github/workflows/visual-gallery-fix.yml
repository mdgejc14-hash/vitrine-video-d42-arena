name: visual-gallery-fix

# D42.31 — IMAGE-FIX : capture ciblée de correction (profil « camerafix »).
# 1) Viseur caméra via SCREENRECORD (contenu composé réel) — diagnostic :
#    le MP4 exporté est riche (flux CameraX + enregistrement SAINS) mais
#    `screencap` capture le SurfaceView en bandes (mosaïque vue par le
#    fondateur). Screencaps de diagnostic conservés à côté.
# 2) Gabarit léger T4 « Promotion » (33 s) : export attendu ~30 min
#    (référence : p1-official 43168986328 sur la même APK RC15) → capture
#    des écrans « Vidéo prête ! », feuille de partage, et retour au
#    tableau de bord APRÈS export.
# Aucune autre campagne relancée. Aucune modification produit.

on:
  workflow_dispatch:

concurrency:
  group: visual-gallery
  cancel-in-progress: false

jobs:
  gallery-camerafix-fr:
    runs-on: ubuntu-latest
    timeout-minutes: 165
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - name: APK RC15 exacte (sha256 vérifié)
        run: |
          set -e
          curl -sL -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/octet-stream" \
            "https://api.github.com/repos/${{ github.repository }}/releases/assets/738360276" -o rc15.apk
          ls -la rc15.apk
          echo "fd28ffc75cc7ec22c0edd6dcf2c63b1d9fab31469505ede079ddb3aeb3b78936  rc15.apk" | sha256sum -c -
      - name: KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
      - name: ffmpeg présent (extraction de frames screenrecord)
        run: command -v ffmpeg && ffmpeg -version | head -1
      - name: Galerie FR camerafix (viseur screenrecord + export T4 + partage + dashboard)
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: default
          arch: x86_64
          profile: pixel_5
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back emulated -camera-front emulated
          script: |
            adb devices
            bash tools/e2e/run_gallery.sh fr camerafix rc15.apk
      - name: Artefacts
        if: always()
        uses: actions/upload-artifact@v4
        with: { name: gallery-camerafix-fr, path: artifacts/gallery/**, retention-days: 14, if-no-files-found: warn }
