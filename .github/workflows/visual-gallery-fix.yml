name: visual-gallery-fix

# D42.31 — IMAGE-FIX : campagnes ciblées de correction.
# 1) camerafix (v10, LIVRÉ — run 43395637118) : viseur caméra via
#    SCREENRECORD (contenu composé réel) — le flux CameraX et
#    l'enregistrement sont sains ; screencaps de diagnostic conservés.
# 2) exportfix (v11) : écrans « Vidéo prête ! » + feuille de partage via
#    SCREENRECORD. RCA : `screencap` renvoie des fichiers VIDES dès que
#    l'export sature swiftshader — constaté sur 5 runs (v8 base-fr 057-061,
#    v8 base-en 039-043, p1-official 29-30, lab p1-debug, lab offline-export :
#    dumps et MP4 réels, PNG 0 octet partout).
#    Gabarit T1 « Nouvel arrivage » (export abouti ~14 min, référence
#    p1-official 43168986328 sur la même APK RC15) ; écran maintenu allumé ;
#    test « écran éteint » sauté (déjà prouvé 3×) ; fenêtre 95 min ;
#    timeout job 135 min ; MP4 tiré en preuve + ffprobe.
# Aucune autre campagne relancée. Aucune modification produit.

on:
  workflow_dispatch:
    inputs:
      profil:
        description: 'profil de correction à exécuter'
        required: true
        default: 'exportfix'
        type: choice
        options:
          - exportfix
          - camerafix

concurrency:
  group: visual-gallery
  cancel-in-progress: false

jobs:
  gallery-exportfix-fr:
    if: inputs.profil == 'exportfix'
    runs-on: ubuntu-latest
    timeout-minutes: 135
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - name: APK RC15 exacte (sha256 vérifié)
        run: |
          set -e
          curl -sL -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/octet-stream" \
            "https://api.github.com/repos/${{ github.repository }}/releases/assets/738360276" -o rc15.apk
          ls -la rc15.apk
          echo "fd28ffc75cc7ec22c0edd6dcf2c63b1d9fab31469505ede079ddb3aeb3b78936  rc15.apk" | sha256sum -c -
      - name: KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
      - name: ffmpeg (extraction de frames screenrecord)
        run: |
          if ! command -v ffmpeg >/dev/null 2>&1; then
            sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
          fi
          command -v ffmpeg && ffmpeg -version | head -1
      - name: Galerie FR exportfix (« Vidéo prête ! » + partage, screenrecord)
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: default
          arch: x86_64
          profile: pixel_5
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back emulated -camera-front emulated
          script: |
            adb devices
            bash tools/e2e/run_gallery.sh fr exportfix rc15.apk
      - name: Artefacts
        if: always()
        uses: actions/upload-artifact@v4
        with: { name: gallery-exportfix-fr, path: artifacts/gallery/**, retention-days: 14, if-no-files-found: warn }

  gallery-camerafix-fr:
    if: inputs.profil == 'camerafix'
    runs-on: ubuntu-latest
    timeout-minutes: 165
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - name: APK RC15 exacte (sha256 vérifié)
        run: |
          set -e
          curl -sL -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/octet-stream" \
            "https://api.github.com/repos/${{ github.repository }}/releases/assets/738360276" -o rc15.apk
          ls -la rc15.apk
          echo "fd28ffc75cc7ec22c0edd6dcf2c63b1d9fab31469505ede079ddb3aeb3b78936  rc15.apk" | sha256sum -c -
      - name: KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
      - name: ffmpeg (extraction de frames screenrecord)
        run: |
          if ! command -v ffmpeg >/dev/null 2>&1; then
            sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
          fi
          command -v ffmpeg && ffmpeg -version | head -1
      - name: Galerie FR camerafix (viseur screenrecord)
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: default
          arch: x86_64
          profile: pixel_5
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back emulated -camera-front emulated
          script: |
            adb devices
            bash tools/e2e/run_gallery.sh fr camerafix rc15.apk
      - name: Artefacts
        if: always()
        uses: actions/upload-artifact@v4
        with: { name: gallery-camerafix-fr, path: artifacts/gallery/**, retention-days: 14, if-no-files-found: warn }
