name: Backup D1 to Backblaze B2

on:
  workflow_dispatch:
  schedule:
    # Tous les jours à 03:00 UTC (04:00 au Bénin)
    - cron: '0 3 * * *'

permissions:
  contents: read

concurrency:
  group: vitrine-video-d1-backup
  cancel-in-progress: false

jobs:
  backup:
    # D42.23 : cadrage architectural — ce workflow exige des secrets Actions
    # qui n'existent que dans le dépôt PRIVÉ mdgejc14-hash/vitrine-video
    # (inventaire checkpoint D42_23/01). Dans le miroir public (sans secrets),
    # il échouerait systématiquement sans information : on le SAUTE
    # honnêtement ici ; il s'exécute normalement dans le dépôt privé.
    # D42.24 : le miroir public devient l'usine de qualification gratuite
    # (runners standards ubuntu-latest gratuits en public — mission 0 FCFA).
    # Exécution autorisée sur le miroir pour dispatch/schedule/tags
    # (collaborateurs uniquement ; les PR n'ont jamais les secrets).
    # Kill-switch : variable de dépôt OPS_ENABLED=false coupe la chaîne ops
    # du miroir sans toucher aux fichiers. Le privé reste autorisé (clause 1).
    # D42.24 : CLOUDFLARE_ACCOUNT_ID = littéral committé NON-secret (compte
    # propriétaire des D1, cf. deploy-production.yml) — le secret du privé du
    # même nom pointait ailleurs (« No access… », 31/10/2026) ; corrigé.
    if: github.repository == 'mdgejc14-hash/vitrine-video' || (github.repository == 'mdgejc14-hash/vitrine-video-d42-arena' && github.event_name != 'pull_request')
    name: Export D1 and upload private backup
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: d7dac13da931423a19812f6d9116bd47
      # D42.25 (runs 42495212327, reprise fondateur 08/11 soir) : le backup
      # PRÉFÈRE la clé dédiée (B2_BACKUP_KEY_ID/B2_BACKUP_APPLICATION_KEY,
      # moindre privilège) ; à défaut il retombe sur B2_KEY_ID/
      # B2_APPLICATION_KEY (dont la valeur a pu être mise à jour par le
      # fondateur avec une clé couvrant le backup) — dans TOUS les cas le
      # pré-vol HeadBucket SIGNÉ décide avant tout effet de bord (403 =
      # refus propre avec message actionnable).
      B2_BACKUP_KEY_ID: ${{ secrets.B2_BACKUP_KEY_ID || secrets.B2_KEY_ID }}
      B2_BACKUP_APPLICATION_KEY: ${{ secrets.B2_BACKUP_APPLICATION_KEY || secrets.B2_APPLICATION_KEY }}
      B2_BACKUP_BUCKET: ${{ secrets.B2_BACKUP_BUCKET }}
      B2_S3_ENDPOINT: ${{ secrets.B2_S3_ENDPOINT }}

    steps:
      - name: Gate OPS_ENABLED (défaut REFUSÉ — D42.25 P0)
        env:
          VAR_OPS_ENABLED: ${{ vars.OPS_ENABLED }}
          SEC_OPS_ENABLED: ${{ secrets.OPS_ENABLED }}
        run: |
          if [ "${VAR_OPS_ENABLED}" != "true" ] && [ "${SEC_OPS_ENABLED}" != "true" ]; then
            echo "::error::Opération sensible REFUSÉE par défaut : OPS_ENABLED != true. Poser la variable de dépôt OPS_ENABLED=true (Settings → Secrets and variables → Actions → onglet Variables) OU le secret OPS_ENABLED=true, puis relancer."
            exit 1
          fi
          echo "PASS: OPS_ENABLED=true — opération sensible autorisée"

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Validate required configuration
        shell: bash
        run: |
          set -euo pipefail
          missing=0
          for name in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID B2_BACKUP_KEY_ID B2_BACKUP_APPLICATION_KEY B2_BACKUP_BUCKET B2_S3_ENDPOINT; do
            if [[ -z "${!name:-}" ]]; then
              echo "ERROR: secret/variable missing: ${name}"
              missing=1
            fi
          done
          if [[ "$missing" -ne 0 ]]; then
            echo "Add all required repository secrets before running the workflow."
            exit 1
          fi
          # D42.25 (run 42494678205) : la console Backblaze affiche
          # l'endpoint S3 SANS schéma (« s3.<region>.backblazeb2.com ») —
          # on NORMALISE au lieu de rejeter, puis on revalide le domaine.
          ep="${B2_S3_ENDPOINT%%\"}"
          ep="${ep%% }"
          ep="${ep## }"
          ep="${ep%%/}"
          ep="${ep#https://}"
          ep="${ep#http://}"
          if [[ "${ep}" == s3.*.backblazeb2.com ]]; then
            echo "B2_S3_ENDPOINT normalisé (schéma https ajouté) — domaine valide."
            echo "B2_S3_ENDPOINT=https://${ep}" >> "$GITHUB_ENV"
          else
            echo "ERROR: B2_S3_ENDPOINT must look like https://s3.<region>.backblazeb2.com"
            echo "Sur la page du bucket B2 → « Endpoint », collez : s3.<region>.backblazeb2.com (ou avec https://) — PAS l'URL apiNNN.backblazeb2.com (API native)."
            exit 1
          fi
          test -f wrangler.jsonc -o -f wrangler.toml -o -f wrangler.json

      - name: Export remote Cloudflare D1 database
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p backup-output
          npx --yes wrangler@4 d1 export vitrine-video-db \
            --remote \
            --output=backup-output/vitrine-video-db.sql \
            --skip-confirmation
          test -s backup-output/vitrine-video-db.sql
          sha256sum backup-output/vitrine-video-db.sql > backup-output/vitrine-video-db.sql.sha256
          echo "Export created; SQL bytes: $(wc -c < backup-output/vitrine-video-db.sql)"
          echo "SHA-256 file created. SQL content is not printed to the logs."

      - name: Install minimal S3 client
        run: python -m pip install --disable-pip-version-check --no-input 'boto3>=1.34,<2'

      - name: Pre-flight bucket backup (HeadBucket signé — D42.25, run 42494796528)
        # Le run 42494796528 est mort sur ConnectionClosedError SANS réponse
        # HTTP : ce pré-vol signé discrimine la cause exacte (404 = bucket
        # inexistant sur cette région ; 403 = clé non autorisée sur ce bucket ;
        # connexion fermée = région d'endpoint incorrecte) et échoue propre
        # avec le message actionnable AVANT tout effet de bord.
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import os, re, sys
          from urllib.parse import urlparse
          import boto3
          from botocore.config import Config
          from botocore.exceptions import ClientError, ConnectionClosedError, EndpointConnectionError

          endpoint = os.environ["B2_S3_ENDPOINT"].rstrip("/")
          bucket = os.environ["B2_BACKUP_BUCKET"].strip()
          m = re.fullmatch(r"s3\.([a-z0-9-]+)\.backblazeb2\.com", urlparse(endpoint).netloc)
          if not m:
              raise SystemExit("Endpoint non conforme après normalisation.")
          region = m.group(1)
          print(f"Pré-vol : endpoint région = {region} ; bucket masqué ({len(bucket)} caractères)")
          client = boto3.client(
              "s3", endpoint_url=endpoint, region_name=region,
              aws_access_key_id=os.environ["B2_BACKUP_KEY_ID"],
              aws_secret_access_key=os.environ["B2_BACKUP_APPLICATION_KEY"],
              config=Config(signature_version="s3v4", retries={"max_attempts": 2, "mode": "standard"}),
          )
          try:
              client.head_bucket(Bucket=bucket)
              print("PASS : HeadBucket 200 — bucket joignable et clé autorisée.")
          except ClientError as e:
              code = e.response["ResponseMetadata"]["HTTPStatusCode"]
              if code == 404:
                  print("::error::NoSuchBucket (404) — le bucket n'existe pas sur cette région d'endpoint. Vérifier B2_BACKUP_BUCKET (nom EXACT du bucket) et B2_S3_ENDPOINT (région de la page du bucket).")
              elif code == 403:
                  print("::error::AccessDenied (403) — bucket joignable mais la clé utilisée n'a pas les droits sur CE bucket. Correction : (option dédiée, recommandée) créer une clé B2 writeFiles limitée au bucket backup et poser B2_BACKUP_KEY_ID + B2_BACKUP_APPLICATION_KEY ; ou (option mise à jour) mettre à jour B2_KEY_ID/B2_APPLICATION_KEY avec une clé couvrant média-lecture + backup-écriture.")
              else:
                  print(f"::error::HeadBucket HTTP {code} — {e}")
              sys.exit(1)
          except (ConnectionClosedError, EndpointConnectionError) as e:
              print("::error::Connexion fermée sans réponse HTTP — l'endpoint ne sert pas ce bucket (région incorrecte ou bucket inexistant). Recoller B2_S3_ENDPOINT = endpoint EXACT affiché sur la page du bucket B2 (champ « Endpoint »).")
              sys.exit(1)
          PY

      - name: Upload SQL and checksum to private Backblaze B2
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import os
          import re
          from datetime import datetime, timezone
          from pathlib import Path
          from urllib.parse import urlparse
          import boto3
          from botocore.config import Config

          endpoint = os.environ["B2_S3_ENDPOINT"].rstrip("/")
          bucket = os.environ["B2_BACKUP_BUCKET"].strip()
          parsed = urlparse(endpoint)
          match = re.fullmatch(r"s3\.([a-z0-9-]+)\.backblazeb2\.com", parsed.netloc)
          if parsed.scheme != "https" or not match:
              raise SystemExit("B2_S3_ENDPOINT is not a valid Backblaze S3 endpoint.")
          region = match.group(1)
          sql_path = Path("backup-output/vitrine-video-db.sql")
          checksum_path = Path("backup-output/vitrine-video-db.sql.sha256")
          if not sql_path.is_file() or sql_path.stat().st_size == 0 or not checksum_path.is_file():
              raise SystemExit("SQL export or checksum is missing/empty.")

          timestamp = datetime.now(timezone.utc).strftime("%Y/%m/%d/%H%M%S")
          prefix = f"d1/{timestamp}"
          client = boto3.client(
              "s3",
              endpoint_url=endpoint,
              region_name=region,
              aws_access_key_id=os.environ["B2_BACKUP_KEY_ID"],
              aws_secret_access_key=os.environ["B2_BACKUP_APPLICATION_KEY"],
              config=Config(signature_version="s3v4", retries={"max_attempts": 3, "mode": "standard"}),
          )

          uploads = [
              (sql_path, f"{prefix}/vitrine-video-db.sql", "application/sql"),
              (checksum_path, f"{prefix}/vitrine-video-db.sql.sha256", "text/plain; charset=utf-8"),
          ]
          for path, key, content_type in uploads:
              with path.open("rb") as body:
                  client.put_object(
                      Bucket=bucket,
                      Key=key,
                      Body=body,
                      ContentLength=path.stat().st_size,
                      ContentType=content_type,
                  )
              print(f"Uploaded: s3://{bucket}/{key} ({path.stat().st_size} bytes)")

          print("B2 upload API accepted both objects.")
          print("Remote read-back is not attempted because the B2 key is intentionally Write Only.")
          PY

      - name: Final status
        if: success()
        run: echo "D1 backup exported and uploaded to private B2. Check the Actions log for object paths and checksum."
