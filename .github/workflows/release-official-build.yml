name: release-official-build
# D42.17 option C (checkpoint 01_OPTIONS_SIGNATURE.md) — étage 1/3 :
# build RELEASE (R8 complet, empreinte officielle PUBLIQUE injectée via
# -PvvApkSha256 -> porte d'intégrité V2.0 §22 ACTIVE) SANS AUCUN SECRET.
# Sans signing.properties, Gradle signe de la clé debug de recette : cet
# artefact est ensuite RE-SIGNÉ hors CI avec le keystore officiel (la clé ne
# vient JAMAIS sur ce dépôt public), puis seul l'artefact signé est transmis
# pour validation (release asset -> release-official-e2e.yml).
# Déclenchement : push de tag d42.17-build-* (ne touche PAS android-e2e-lab,
# dont le filtre branches ne matche pas les tags — les 9 jobs verts de la
# qualification D42.16/D42.17 ne sont pas relancés).
on:
  push:
    tags: ['d42.17-build-*', 'd42.18-build-*', 'd42.21-build-*', 'd42.27-build-*', 'd42.28-build-*', 'd42.29-build-*', 'd42.30-build-*']

concurrency:
  group: release-official-build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      # D42.28 (P0) : la clé Firebase RÉELLE est injectée comme propriété
      # projet Gradle par variable d'environnement (jamais en argument de
      # commande, jamais dans les logs, jamais dans un commit). Sans cet
      # override, le build reprenait la valeur FACTICE de gradle.properties
      # et l'APK livrée ne pouvait PAS s'authentifier (preuve RC12 : dex
      # contenant AIzaSyD42LABDUMMYKEY, 0 clé réelle).
      ORG_GRADLE_PROJECT_vvFirebaseApiKey: ${{ secrets.FIREBASE_WEB_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Pré-vol secret Firebase (échec clair si absent)
        env:
          FIREBASE_WEB_API_KEY: ${{ secrets.FIREBASE_WEB_API_KEY }}
        run: |
          set -u
          if [ -z "${FIREBASE_WEB_API_KEY:-}" ]; then
            echo "::error::Secret FIREBASE_WEB_API_KEY manquant (Settings → Secrets and variables → Actions)"
            exit 1
          fi
          echo "PASS: FIREBASE_WEB_API_KEY présent (valeur jamais affichée)"
      - name: Tests unitaires feature-export (non-régression FGS D42.18)
        run: |
          set -euo pipefail
          # Journal INTÉGRAL en fichier : en cas d'échec, extraire les vraies
          # erreurs (le tail -40 du build-1 les avait tronquées — leçon D42.18).
          ./gradlew :feature-export:testDebugUnitTest \
            -PvvApkSha256=758077eb1388376d8ac797db88eec976b27f7a553dc09d6d85529fbd0b33e192 \
            --stacktrace > gradle_unit_tests.log 2>&1 || {
              echo "=== ÉCHEC gradle : lignes d'erreur (avec contexte) ==="
              grep -nE -A6 "What went wrong|^e: |error: |Execution failed for|Caused by:|FAILED" gradle_unit_tests.log | head -80 || true
              echo "=== 80 dernières lignes ==="
              tail -80 gradle_unit_tests.log
              exit 1
            }
          tail -5 gradle_unit_tests.log
          echo "=== verdict des tests unitaires ==="
          python3 - <<'PYV'
          import glob, xml.etree.ElementTree as ET
          total = failures = 0
          for f in glob.glob('feature-export/build/test-results/testDebugUnitTest/*.xml'):
              r = ET.parse(f).getroot()
              total += int(r.get('tests', 0)); failures += int(r.get('failures', 0)) + int(r.get('errors', 0))
          print(f'tests={total} échecs={failures}')
          assert failures == 0, 'des tests unitaires ont échoué'
          PYV
      - name: APK release R8 (empreinte officielle injectée, zéro secret)
        run: |
          set -euo pipefail
          ./gradlew :app:assembleRelease \
            -PvvApkSha256=758077eb1388376d8ac797db88eec976b27f7a553dc09d6d85529fbd0b33e192 \
            --stacktrace 2>&1 | tail -20
          APK=$(ls app/build/outputs/apk/release/*.apk | head -1)
          ls -la "$APK"
          sha256sum "$APK" | tee build_apk_sha256.txt
      - name: Contrôle dex — clé Firebase réelle présente, factice absente
        # D42.28 (P0) : PORTE. L'APK de livraison doit contenir la clé du
        # projet Firebase réel (secret Actions) et NE DOIT PAS contenir la
        # valeur factice de gradle.properties. Comparaison binaire exacte,
        # la valeur n'est jamais affichée (pattern du workflow
        # android-e2e-production-equivalent, run 42482295447).
        env:
          FIREBASE_WEB_API_KEY_ENV: ${{ secrets.FIREBASE_WEB_API_KEY }}
        run: |
          set -euo pipefail
          python3 - <<'PYV'
          import os, subprocess, tempfile, glob
          key = os.environ.get('FIREBASE_WEB_API_KEY_ENV') or ''
          assert key, 'secret absent'
          with tempfile.TemporaryDirectory() as d:
              subprocess.run(['unzip', '-q', '-o', 'app/build/outputs/apk/release/app-release.apk',
                              'classes*.dex', '-d', d], check=True)
              dexes = sorted(glob.glob(os.path.join(d, 'classes*.dex')))
              real = dummy = 0
              for dex in dexes:
                  data = open(dex, 'rb').read()
                  real += data.count(key.encode())
                  dummy += data.count(b'AIzaSyD42LABDUMMYKEY')
                  print('DIAG dex:', os.path.basename(dex), '| taille:', len(data),
                        '| occurrences clé réelle:', data.count(key.encode()),
                        '| occurrences factice:', data.count(b'AIzaSyD42LABDUMMYKEY'))
          print('clé réelle présente (binaire) :', real > 0)
          print('clé factice présente (binaire) :', dummy > 0)
          assert real > 0 and dummy == 0, 'échec porte clé Firebase (réelle absente ou factice présente)'
          print('PASS: dex = clé Firebase réelle uniquement (comparaison binaire exacte)')
          PYV
      - name: Artefact build (re-signature locale ensuite)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-build-unsigned
          path: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/mapping/release/mapping.txt
            build_apk_sha256.txt
            feature-export/build/test-results/testDebugUnitTest/*.xml
            gradle_unit_tests.log
          retention-days: 7
          if-no-files-found: error
