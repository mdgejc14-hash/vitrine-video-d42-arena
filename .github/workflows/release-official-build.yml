name: release-official-build
# D42.17 option C (checkpoint 01_OPTIONS_SIGNATURE.md) — étage 1/3 :
# build RELEASE (R8 complet, empreinte officielle PUBLIQUE injectée via
# -PvvApkSha256 -> porte d'intégrité V2.0 §22 ACTIVE) SANS AUCUN SECRET.
# Sans signing.properties, Gradle signe de la clé debug de recette : cet
# artefact est ensuite RE-SIGNÉ hors CI avec le keystore officiel (la clé ne
# vient JAMAIS sur ce dépôt public), puis seul l'artefact signé est transmis
# pour validation (release asset -> release-official-e2e.yml).
# Déclenchement : push de tag d42.17-build-* (ne touche PAS android-e2e-lab,
# dont le filtre branches ne matche pas les tags — les 9 jobs verts de la
# qualification D42.16/D42.17 ne sont pas relancés).
on:
  push:
    tags: ['d42.17-build-*']

concurrency:
  group: release-official-build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: APK release R8 (empreinte officielle injectée, zéro secret)
        run: |
          set -euo pipefail
          ./gradlew :app:assembleRelease \
            -PvvApkSha256=758077eb1388376d8ac797db88eec976b27f7a553dc09d6d85529fbd0b33e192 \
            --stacktrace 2>&1 | tail -20
          APK=$(ls app/build/outputs/apk/release/*.apk | head -1)
          ls -la "$APK"
          sha256sum "$APK" | tee build_apk_sha256.txt
      - name: Artefact build (re-signature locale ensuite)
        uses: actions/upload-artifact@v4
        with:
          name: release-build-unsigned
          path: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/mapping/release/mapping.txt
            build_apk_sha256.txt
          retention-days: 7
          if-no-files-found: error
