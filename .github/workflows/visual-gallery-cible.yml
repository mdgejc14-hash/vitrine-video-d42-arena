name: visual-gallery-cible

# D42.31 — Phase A : CAPTURE CIBLÉE (profil « cible ») — une seule chose à la
# fois. v9 : l'écran E7 FR (aperçu) manquait dans base-fr v8 alors qu'il était
# atteint (dump _e7_tardif : « Vérifie ces informations », « Créer ma vidéo »)
# — le titre avait défilé hors fenêtre à cause des swipes de recherche du
# harnais. Ce workflow capture UNIQUEMENT ce parcours jusqu'à E7, sans
# attente d'export. Aucune autre campagne n'est relancée.

on:
  workflow_dispatch:

concurrency:
  group: visual-gallery
  cancel-in-progress: false

jobs:
  gallery-cible-fr:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - name: APK RC15 exacte (sha256 vérifié)
        run: |
          set -e
          curl -sL -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/octet-stream" \
            "https://api.github.com/repos/${{ github.repository }}/releases/assets/738360276" -o rc15.apk
          ls -la rc15.apk
          echo "fd28ffc75cc7ec22c0edd6dcf2c63b1d9fab31469505ede079ddb3aeb3b78936  rc15.apk" | sha256sum -c -
      - name: KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
      - name: Galerie FR ciblée — E7 (parcours direct, permission accordée, sans export)
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: default
          arch: x86_64
          profile: pixel_5
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back emulated -camera-front emulated
          script: |
            adb devices
            bash tools/e2e/run_gallery.sh fr cible rc15.apk
      - name: Artefacts
        if: always()
        uses: actions/upload-artifact@v4
        with: { name: gallery-cible-fr, path: artifacts/gallery/**, retention-days: 14, if-no-files-found: warn }
