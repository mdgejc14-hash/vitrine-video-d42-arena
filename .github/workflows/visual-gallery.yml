name: visual-gallery

# D42.31 — PHASE A : galerie visuelle intégrale de l'APK RC15 (IMMUTABLE).
# Télécharge l'APK exacte de la release 442574529 (asset 738360276, tag
# d42.30-rc15), VÉRIFIE son SHA-256, puis capture chaque écran du parcours
# réel sur émulateur via tools/e2e/run_gallery.sh (outil de capture — aucune
# modification de l'application).
#
# Groupes de concurrence SÉPARÉS de android-e2e-lab : ce workflow ne peut ni
# annuler ni être annulé par un lab en vol (règle D42.30 : jamais de push
# pendant une campagne ; jamais d'annulation sauvage).

on:
  workflow_dispatch:

concurrency:
  group: visual-gallery
  cancel-in-progress: false

jobs:
  gallery-fr:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Télécharger l'APK RC15 exacte (release 442574529, asset 738360276)
        run: |
          set -e
          curl -sL -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/octet-stream" \
            "https://api.github.com/repos/${{ github.repository }}/releases/assets/738360276" \
            -o rc15.apk
          ls -la rc15.apk
          echo "fd28ffc75cc7ec22c0edd6dcf2c63b1d9fab31469505ede079ddb3aeb3b78936  rc15.apk" | sha256sum -c -

      - name: Activation KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -l /dev/kvm || echo "KVM ABSENT"

      - name: Galerie FR — base (parcours complet + 6 secteurs + caméra + export)
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: default
          arch: x86_64
          profile: pixel_5
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -camera-front none
          script: |
            adb devices
            bash tools/e2e/run_gallery.sh fr base rc15.apk

      - name: Galerie FR — police 130 % (écrans clés)
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: default
          arch: x86_64
          profile: pixel_5
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -camera-front none
          script: |
            adb devices
            bash tools/e2e/run_gallery.sh fr font130 rc15.apk

      - name: Galerie FR — petit écran 720x1520 (écrans clés)
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: default
          arch: x86_64
          profile: pixel_5
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -camera-front none
          script: |
            adb devices
            bash tools/e2e/run_gallery.sh fr petit rc15.apk

      - name: Artefacts galerie FR
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gallery-fr
          path: |
            artifacts/gallery/**
          retention-days: 14
          if-no-files-found: warn

  gallery-en-offline:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Télécharger l'APK RC15 exacte (release 442574529, asset 738360276)
        run: |
          set -e
          curl -sL -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/octet-stream" \
            "https://api.github.com/repos/${{ github.repository }}/releases/assets/738360276" \
            -o rc15.apk
          ls -la rc15.apk
          echo "fd28ffc75cc7ec22c0edd6dcf2c63b1d9fab31469505ede079ddb3aeb3b78936  rc15.apk" | sha256sum -c -

      - name: Activation KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -l /dev/kvm || echo "KVM ABSENT"

      - name: Galerie EN — base (parcours complet anglais)
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: default
          arch: x86_64
          profile: pixel_5
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -camera-front none
          script: |
            adb devices
            bash tools/e2e/run_gallery.sh en base rc15.apk

      - name: Galerie FR — hors connexion (états déconnectés, parcours complet)
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: default
          arch: x86_64
          profile: pixel_5
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -camera-front none
          script: |
            adb devices
            bash tools/e2e/run_gallery.sh fr offline rc15.apk

      - name: Artefacts galerie EN + hors connexion
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gallery-en-offline
          path: |
            artifacts/gallery/**
          retention-days: 14
          if-no-files-found: warn
