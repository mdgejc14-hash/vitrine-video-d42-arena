name: visual-gallery

# D42.31 — PHASE A : galerie visuelle intégrale de l'APK RC15 (IMMUTABLE).
# v2 : 4 jobs parallèles (le run 43225168935 a été annulé au timeout global
# de 150 min pour 2 jobs séquentiels ; chaque profil a désormais son propre
# job et son propre timeout). Télécharge l'APK exacte de la release 442574529
# (asset 738360276, tag d42.30-rc15), VÉRIFIE son SHA-256, puis capture le
# parcours réel via tools/e2e/run_gallery.sh (outil — aucune modification de
# l'application).
#
# Concurrence SÉPARÉE du lab : ce workflow ne peut ni annuler ni être annulé
# par android-e2e-lab (règle : jamais d'interférence avec une campagne).

on:
  workflow_dispatch:

concurrency:
  group: visual-gallery
  cancel-in-progress: false

jobs:
  gallery-base-fr:
    runs-on: ubuntu-latest
    timeout-minutes: 100
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - name: APK RC15 exacte (sha256 vérifié)
        run: |
          set -e
          curl -sL -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/octet-stream" \
            "https://api.github.com/repos/${{ github.repository }}/releases/assets/738360276" -o rc15.apk
          ls -la rc15.apk
          echo "fd28ffc75cc7ec22c0edd6dcf2c63b1d9fab31469505ede079ddb3aeb3b78936  rc15.apk" | sha256sum -c -
      - name: KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
      - name: Galerie FR base (parcours complet + 6 secteurs + caméra + export + dashboard)
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: default
          arch: x86_64
          profile: pixel_5
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -camera-front none
          script: |
            adb devices
            bash tools/e2e/run_gallery.sh fr base rc15.apk
      - name: Artefacts
        if: always()
        uses: actions/upload-artifact@v4
        with: { name: gallery-base-fr, path: artifacts/gallery/**, retention-days: 14, if-no-files-found: warn }

  gallery-base-en:
