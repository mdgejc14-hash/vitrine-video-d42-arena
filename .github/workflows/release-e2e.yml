name: release-e2e

# D42.14 — Preuve sur la VÉRITABLE release RC6 (dépôt privé, minutes incluses).
#
# Contrat : l'APK téléchargé ici est celui publié dans la Release privée, pas un
# build local. Son SHA-256 est vérifié AVANT installation : si l'empreinte ne
# correspond pas, le job échoue et aucun test n'est exécuté.
#
# Ce workflow n'expose aucun secret : il utilise GITHUB_TOKEN (lecture des
# releases de CE dépôt) et rien d'autre.

# D42.14 — déclenchement par PUSH : le PAT de la mission n'a AUCUNE portée
# Actions (GET /actions/workflows et POST /dispatches => 403), et la consigne
# est de ne pas demander de jeton plus puissant. Un push sur la branche de
# livraison suffit donc à lancer la preuve sur la vraie release.
on:
  push:
    branches:
      - d42.14-critical-paths
    paths:
      - '.github/workflows/release-e2e.yml'
      - 'tools/e2e/**'
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag de la release à tester"
        default: "v0.8.0-b0-d42.13-rc6"
      sha256:
        description: "SHA-256 attendu de l'APK"
        default: "5c3955731de9765327cc95da3ff2fc098b5dd09dc50a6716819404914c377495"

permissions:
  contents: read

env:
  TAG: ${{ inputs.tag || 'v0.8.0-b0-d42.13-rc6' }}
  SHA_ATTENDU: ${{ inputs.sha256 || '5c3955731de9765327cc95da3ff2fc098b5dd09dc50a6716819404914c377495' }}

jobs:
  release-rc6:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Télécharger l'APK publié (Release privée)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p rc
          gh release download "$TAG" --pattern '*.apk' --dir rc
          ls -la rc
          ACTUAL=$(sha256sum rc/*.apk | cut -d' ' -f1)
          ATTENDU="$SHA_ATTENDU"
          echo "sha256 attendu : $ATTENDU"
          echo "sha256 obtenu  : $ACTUAL"
          if [ "$ACTUAL" != "$ATTENDU" ]; then
            echo "::error::Empreinte de la release différente de celle annoncée."
            exit 1
          fi
          echo "PASS : APK de release intègre"
          mv rc/*.apk rc/release.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --print-certs rc/release.apk | head -5 || true
          echo "sha256_release=$ACTUAL" >> "$GITHUB_ENV"

      - name: Activation KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -l /dev/kvm

      # Caméra VIRTUELLE de l'émulateur : la chaîne CameraX -> MediaCodec -> MP4
      # est réelle, l'image filmée est synthétique. Aucun résultat ici n'est
      # présenté comme un test de capteur physique.
      - name: P0 sur la RC6 (langue, connexion, carrousel, activité)
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: default
          arch: x86_64
          profile: pixel_5
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back emulated -camera-front none
          script: |
            adb devices
            bash tools/e2e/run_p0.sh rc6_release base fr

      - name: Artefacts P0 RC6
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rc6-p0
          path: |
            artifacts/**
            rc/release.apk
          retention-days: 14
          if-no-files-found: warn

      - name: P1 sur la RC6 (catalogue, brief, caméra, export, partage)
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: default
          arch: x86_64
          profile: pixel_5
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back emulated -camera-front none
          script: |
            adb devices
            bash tools/e2e/run_p1.sh rc6_release_p1 rc/release.apk

      - name: Artefacts P1 RC6
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rc6-p1
          path: artifacts/**
          retention-days: 14
          if-no-files-found: warn

      - name: Bilan
        if: always()
        run: |
          for f in artifacts/*/summary.txt; do [ -f "$f" ] && { echo "--- $f"; cat "$f"; }; done
          echo "=== FAIL ==="; grep -h FAIL artifacts/*/results.tsv 2>/dev/null || echo aucun
          echo "=== BLOCKED ==="; grep -h BLOCKED artifacts/*/results.tsv 2>/dev/null || echo aucun
