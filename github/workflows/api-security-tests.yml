
name: API Security CI

on:
  push:
    branches:
      - main
    paths:
      - "src/**"
      - "db/migrations/**"
      - "scripts/security-ci.mjs"
      - "package.json"
      - "package-lock.json"
      - "wrangler.jsonc"
      - ".github/workflows/api-security-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: api-security-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api-security-tests:
    name: Local D1 and API security tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      API_BASE_URL: http://127.0.0.1:8788

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Initialize local D1 schema
        run: >
          npx wrangler d1 execute vitrine-video-db
          --local
          --file=db/migrations/0001_init.sql

      - name: Seed CI-only template
        run: >
          npx wrangler d1 execute vitrine-video-db
          --local
          --command="INSERT OR REPLACE INTO templates
          (id, secteur, langue, duree_cible_s, edl_json,
          regles_qc_json, version, actif)
          VALUES
          ('ci-commerce-fr-v1', 'commerce', 'fr', 30,
          '{}', '{}', 1, 1);"

      - name: Start local Worker
        run: |
          nohup npm run dev -- --local --ip 127.0.0.1 \
            --port 8788 --show-interactive-dev-session=false \
            > /tmp/vitrine-video-worker.log 2>&1 &
          echo $! > /tmp/vitrine-video-worker.pid

      - name: Wait for local API health
        run: |
          for attempt in $(seq 1 30); do
            if curl --silent --fail \
              http://127.0.0.1:8788/health \
              > /tmp/vitrine-video-health.json 2>/dev/null; then
              cat /tmp/vitrine-video-health.json
              exit 0
            fi
            sleep 2
          done

          echo "Le Worker local ne répond pas."
          cat /tmp/vitrine-video-worker.log
          exit 1

      - name: Run API security integration tests
        env:
          FIREBASE_WEB_API_KEY: ${{ secrets.FIREBASE_WEB_API_KEY }}
          FIREBASE_TEST_A_EMAIL: ${{ secrets.FIREBASE_TEST_A_EMAIL }}
          FIREBASE_TEST_A_PASSWORD: ${{ secrets.FIREBASE_TEST_A_PASSWORD }}
          FIREBASE_TEST_B_EMAIL: ${{ secrets.FIREBASE_TEST_B_EMAIL }}
          FIREBASE_TEST_B_PASSWORD: ${{ secrets.FIREBASE_TEST_B_PASSWORD }}
        run: node scripts/security-ci.mjs

      - name: Stop local Worker
        if: always()
        run: |
          if [ -f /tmp/vitrine-video-worker.pid ]; then
            kill "$(cat /tmp/vitrine-video-worker.pid)" 2>/dev/null || true
          fi
